[package]
name = "travelmode-gui"
description = "travelmode desktop GUI (GTK4/libadwaita)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "travelmode-gui"
path = "src/main.rs"

[dependencies]
travelmode-core.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
chrono.workspace = true

# relm4's gnome_45 feature maps to gtk 4.5 / libadwaita 1.4 API, which
# compile-time gates out anything newer (the 1.4-only target).
relm4 = { version = "0.11", features = ["libadwaita", "gnome_45"] }
gtk4 = "0.11"
libadwaita = { version = "0.9", features = ["v1_4"] }
ksni = "0.3"
png = "0.17"
